name: Rustfmt check

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    paths:
      - '.github/workflows/rustfmt.yml'
      - 'userspace/**'
      - 'Cargo.toml'
      - '**/rustfmt.toml'
      - '**/.rustfmt.toml'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'dev'
    paths:
      - '.github/workflows/rustfmt.yml'
      - 'userspace/**'
      - 'Cargo.toml'
      - '**/rustfmt.toml'
      - '**/.rustfmt.toml'

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check
